name: CI

# Continuous integration only — no deploy jobs by design.
# Deployment stays manual on the service / reverse-proxy servers.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  php:
    name: PHP tests & style
    # TEMPORARY: disabled until the Pint formatting commit is re-applied.
    # Re-enable by deleting the next line.
    if: false
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, gd, zip, exif, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  docker:
    name: Docker & Traefik configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          cp .env.docker.example .env
          sed -i 's/DB_PASSWORD=change-me/DB_PASSWORD=ci-dummy/' .env
          docker compose -f compose.yml config --quiet

      - name: Validate development compose files
        run: |
          cp .env.dev.example .env.dev
          sed -i 's/DB_PASSWORD=change-me-dev/DB_PASSWORD=ci-dummy/' .env.dev
          docker compose -f compose.yml -f compose.dev.yml --env-file .env.dev config --quiet

      - name: Validate Traefik dynamic file
        run: python3 -c "import yaml, sys; yaml.safe_load(open('traefik/catetin-prod.yml')); print('traefik file OK')"

      - name: Build app image (smoke test, no push)
        run: docker build -t catetin:ci .

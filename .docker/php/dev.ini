; Local-development PHP tuning. Loaded last (zz-) so it wins over local.ini.
; The production image sets opcache.validate_timestamps=0 for performance;
; that would freeze PHP code in memory, so dev re-enables per-request checks.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
display_errors = On
error_reporting = E_ALL
memory_limit = 512M
